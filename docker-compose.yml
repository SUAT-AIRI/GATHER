# VCKG-RAG Neo4j Docker Compose Configuration
# Usage: docker compose up -d

services:
  neo4j:
    image: neo4j:5.15.0-community
    container_name: vckg-neo4j
    ports:
      - "7474:7474"  # HTTP (Browser interface)
      - "7687:7687"  # Bolt (Python driver)
    environment:
      # Initial password (change after first login)
      - NEO4J_AUTH=neo4j/vckg_password_123
      # Memory settings (increased for better performance)
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=8G
      - NEO4J_server_memory_pagecache_size=4G
      # Connection pool settings for high concurrency
      - NEO4J_dbms_connector_bolt_thread__pool__max__size=400
      - NEO4J_dbms_connector_bolt_thread__pool__keep__alive=5m
      # Enable APOC plugin for advanced operations
      - NEO4J_PLUGINS=["apoc"]
      # Allow file import from project directory
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
    volumes:
      # Persist data between container restarts
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
    name: vckg_neo4j_data
  neo4j_logs:
    name: vckg_neo4j_logs
